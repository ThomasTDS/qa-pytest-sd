name: visual-baselines

on:
  push:
    branches: [fix/visual-fonts-wait]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium firefox webkit

      - name: Regenera baselines visuais (Chromium, Firefox e WebKit)
        env:
          HEADLESS: 'true'
          UPDATE_VISUAL_BASELINES: '1'
        run: |
          for browser in chromium firefox webkit; do
            BROWSER=$browser pytest tests/test_visual.py -p no:cacheprovider -q
          done

      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual_baselines/
