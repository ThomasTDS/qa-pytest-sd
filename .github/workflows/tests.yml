name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: pip-audit -r requirements.txt

      - run: ruff check .

      - run: ruff format --check .

      - run: mypy .

      - name: Valida build da imagem Docker
        run: docker build -t qa-pytest-sd .

      - name: Cache navegadores do Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium firefox webkit

      - name: Testes (Chromium)
        run: pytest -n auto --cov --cov-report=xml --html=reports/report-chromium.html --self-contained-html --alluredir=allure-results --reruns 1
        env:
          HEADLESS: 'true'
          BROWSER: chromium
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Envia cobertura para o Codecov
        if: always()
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Testes (Firefox)
        run: pytest -n auto --html=reports/report-firefox.html --self-contained-html --alluredir=allure-results --reruns 1
        env:
          HEADLESS: 'true'
          BROWSER: firefox
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Testes (WebKit)
        run: pytest -n auto --html=reports/report-webkit.html --self-contained-html --alluredir=allure-results --reruns 1
        env:
          HEADLESS: 'true'
          BROWSER: webkit
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Resumo de testes que precisaram de rerun
        if: always()
        run: |
          {
            echo "## Testes que precisaram de rerun"
            echo
            if [ -s reports/flaky-tests.tsv ]; then
              echo "| Navegador | Teste | Último erro |"
              echo "|---|---|---|"
              awk -F'\t' '{ gsub(/\|/, "\\\\|", $3); printf "| %s | `%s` | %s |\n", $1, $2, $3 }' reports/flaky-tests.tsv
            else
              echo "Nenhum teste precisou de rerun nesta execução."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-diffs
          path: reports/visual/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flaky-tests
          path: reports/flaky-tests.tsv
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-reports
          path: reports/report-*.html

      - name: Instala Allure Commandline
        if: always()
        run: |
          curl -sL -o /tmp/allure.tgz https://github.com/allure-framework/allure2/releases/download/2.46.1/allure-2.46.1.tgz
          tar -xzf /tmp/allure.tgz -C /opt
          echo "/opt/allure-2.46.1/bin" >> "$GITHUB_PATH"

      - name: Gera relatorio Allure
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
