name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [test/mutation-testing]

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Roda mutation testing (testes unitários)
        run: mutmut run

      - name: Exporta estatísticas
        if: always()
        run: |
          mutmut export-cicd-stats
          mutmut results --all > mutation-results.txt || true
          cat mutation-results.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-results.txt
          if-no-files-found: ignore
