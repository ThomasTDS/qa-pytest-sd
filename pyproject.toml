[project]
name = "qa-pytest-sd"
version = "1.0.0"
description = "Testes automatizados do automationexercise.com com Pytest + Playwright (versão Python do qa-playwright-sd)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
bdd_features_base_dir = "features"
markers = [
    "TC-001: login com credenciais válidas",
    "TC-002: login com credenciais inválidas",
    "TC-003: cadastro de um novo usuário",
    "TC-004: buscar produtos e visualizar resultados",
    "TC-005: adicionar múltiplos produtos ao carrinho",
    "TC-006: remover um produto do carrinho",
    "TC-007: finalizar compra com sucesso",
    "TC-008: tentar finalizar checkout sem estar logado",
    "TC-009: enviar formulário de contato com sucesso",
    "TC-010: inscrever e-mail na newsletter com sucesso",
    "TC-011: logout",
    "TC-012: cabeçalhos de segurança HTTP presentes",
    "TC-013: redirecionamento HTTP para HTTPS",
    "TC-014: campo de senha deve estar mascarado",
    "TC-015: cookie de sessão deve ter a flag HttpOnly ativada",
    "smoke: cenário crítico de ponta a ponta",
    "unit: testes unitários de page objects, sem navegador real",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
