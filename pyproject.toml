[project]
name = "qa-pytest-sd"
version = "1.0.0"
description = "Testes automatizados do automationexercise.com com Pytest + Playwright (versão Python do qa-playwright-sd)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
bdd_features_base_dir = "features"
markers = [
    "TC-001: login com credenciais válidas",
    "TC-002: login com credenciais inválidas",
    "TC-003: cadastro de um novo usuário",
    "TC-004: buscar produtos e visualizar resultados",
    "TC-005: adicionar múltiplos produtos ao carrinho",
    "TC-006: remover um produto do carrinho",
    "TC-007: finalizar compra com sucesso",
    "TC-008: tentar finalizar checkout sem estar logado",
    "TC-009: enviar formulário de contato com sucesso",
    "TC-010: inscrever e-mail na newsletter com sucesso",
    "TC-011: logout",
    "TC-012: cabeçalhos de segurança HTTP presentes",
    "TC-013: redirecionamento HTTP para HTTPS",
    "TC-014: campo de senha deve estar mascarado",
    "TC-015: cookie de sessão deve ter a flag HttpOnly ativada",
    "TC-016: página de login sem violações críticas de acessibilidade",
    "TC-017: página de produtos sem violações críticas de acessibilidade",
    "TC-018: lista de produtos via API contém um produto conhecido",
    "TC-019: lista de marcas via API não está vazia",
    "TC-020: busca de produtos via API retorna resultados esperados",
    "TC-021: API de produtos rejeita método HTTP não suportado",
    "TC-022: tentar se cadastrar com um e-mail já existente",
    "TC-023: carrinho vazio impede prosseguir para o checkout",
    "TC-024: verificação de login via API com credenciais válidas",
    "TC-025: verificação de login via API com credenciais inválidas",
    "TC-026: criação e remoção de conta via API",
    "TC-027: consulta de detalhes do usuário de teste via API",
    "smoke: cenário crítico de ponta a ponta",
    "unit: testes unitários de page objects, sem navegador real",
    "api: testes da API pública, sem navegador (rodam só no Chromium no CI)",
]

[tool.coverage.run]
source = ["pages", "steps"]
# O Playwright sync API usa greenlets, e o tracer padrão do coverage perde linhas
# executadas logo após chamadas do Playwright. O backend sysmon não tem esse problema.
core = "sysmon"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.mutmut]
source_paths = ["pages"]
also_copy = ["steps", "features", "tests", "conftest.py", "pyproject.toml"]
pytest_add_cli_args_test_selection = ["-m", "unit", "-p", "no:cacheprovider"]
